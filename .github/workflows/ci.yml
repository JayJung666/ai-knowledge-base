name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # =========================================================================
  # 1. Backend CI: Python & FastAPI Test Suite
  # =========================================================================
  backend-ci:
    name: Backend Test & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Backend Unit Tests (pytest)
        env:
          GROQ_API_KEY: "mock_test_key"
          CHROMA_HOST: "local"
        run: |
          pytest tests/ -v --disable-warnings

  # =========================================================================
  # 2. Frontend CI: TypeScript, Linting & Production Build
  # =========================================================================
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Linter (oxlint)
        run: npm run lint

      - name: Run TypeScript & Vite Production Build
        run: npm run build
